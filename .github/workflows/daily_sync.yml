name: Wuppertal RIS Daily Cloud Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Python-Skript ausführen
        env:
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          DIFY_DATASET_ID: ${{ secrets.DIFY_DATASET_ID }}
        run: python sync_ris.py

      - name: Fortschritt (synced_ids.json) ins Repo zurückschreiben
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatischer Sync: Neue Dokumente zur Historie hinzugefügt"
          file_pattern: synced_ids.json
