name: Wuppertal RIS Daily Cloud Sync

on:
  schedule:
    # Startet jeden Tag automatisch um 03:00 Uhr nachts (UTC)
    - cron: '0 3 * * *'
  # Erlaubt es Ihnen auch, den Prozess manuell per Klick zu starten
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Benötigte Zusatzpakete installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Skript ausführen
        env:
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}
          DIFY_DATASET_ID: ${{ secrets.DIFY_DATASET_ID }}
        run: python sync_ris.py
